name: "python-catscore"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  linter-python-catscore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: "Set up Python"
        run: uv python install

      - name: "Install the project"
        working-directory: ./applications/python-catscore/
        run: uv sync --locked --all-extras --dev

      - name: "Run Black"
        working-directory: ./applications/python-catscore/
        run: uv run black --check website

      - name: "Run flake8"
        working-directory: ./applications/python-catscore/
        run: >-
          uv run
          flake8
          --exclude="migrations,website/catscore/settings/*.py"
          --max-line-length=119
          website

      - name: "Run Django checks"
        working-directory: ./applications/python-catscore/
        run: uv run python website/manage.py check

  build-image-python-catscore:
    name: "Build & push image"
    needs: [linter-python-catscore]
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: "Log in to GHCR"
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/kioui/vulnerable-web-applications/python-catscore
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

      - uses: docker/build-push-action@v7
        with:
          context: applications/python-catscore/
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max