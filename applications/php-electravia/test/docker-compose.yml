services:
  electravia:
    build:
      context: ../
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: store
      MYSQL_USER: store
      MYSQL_PASSWORD: password
      MYSQL_HOST: database:3306
    networks:
      - electravia-network
    ports:
      - 80:80

networks:
  electravia-network:
    driver: bridge
