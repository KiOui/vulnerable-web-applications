[project]
name = "python-energyapi"
version = "0.1.0"
description = "A hackable energy API"
readme = "README.md"
authors = [
    { name = "Lars van Rhijn", email = "larsvanrhijn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.19.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
]
prod = [
    "uvicorn>=0.54.0",
]

[tool.black]
exclude = '''
/(
  migrations
  | website/tosti/settings
)/
'''
